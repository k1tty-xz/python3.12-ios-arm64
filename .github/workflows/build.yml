name: Build CPython for rootful iOS 14.8

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'CPYTHON_VERSION'
      - 'CPYTHON_SHA256'
      - 'packaging/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build:
    # macOS 14 arm64 still provides Xcode 15.4, whose deployment-target range
    # includes iOS 14. Newer Xcode releases require iOS 15 or later.
    runs-on: macos-14
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check the pinned Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install Debian packaging tools
        run: brew install dpkg

      - name: Build CPython arm64 package
        run: ./scripts/build.sh

      - name: Upload rootful Debian package
        uses: actions/upload-artifact@v4
        with:
          name: python-ios-rootful-${{ github.sha }}
          path: ${{ runner.temp }}/python-ios-dist/*.deb
          if-no-files-found: error
          retention-days: 14
