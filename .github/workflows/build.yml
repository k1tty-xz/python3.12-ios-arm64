name: Build CPython for rootful iOS 14.8

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'CPYTHON_VERSION'
      - 'CPYTHON_SHA256'
      - 'packaging/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build:
    # macOS 14 arm64 still provides Xcode 15.4, whose deployment-target range
    # includes iOS 14. Newer Xcode releases require iOS 15 or later.
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select the pinned Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun clang --version

      - name: Build CPython, arm64e variant, package, and verify
        run: |
          chmod +x scripts/*.sh
          scripts/build-cpython.sh 2>&1 | tee "$RUNNER_TEMP/python-ios-build.log"

      - name: Show release files
        run: |
          echo "workspace=$GITHUB_WORKSPACE"
          echo "runner_temp=$RUNNER_TEMP"
          find "$RUNNER_TEMP/python-ios-dist" -maxdepth 2 -type f -print -exec ls -lh {} \;

      - name: Upload build log after a failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-ios-build-log-${{ github.sha }}
          path: ${{ runner.temp }}/python-ios-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload rootful Debian package
        uses: actions/upload-artifact@v4
        with:
          name: python-ios-rootful-${{ github.sha }}
          path: ${{ runner.temp }}/python-ios-dist/*.deb
          if-no-files-found: error
          retention-days: 14
